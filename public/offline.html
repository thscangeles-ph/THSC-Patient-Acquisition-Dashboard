<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f281c">
<title>No connection · THSC Queue</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ed; color: #2e291f; font-family: "Aptos", "Segoe UI", Arial, sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 20px 0 8px; font-size: 22px; }
  p { margin: 0; color: #6a604f; line-height: 1.5; }
  button { margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #8b6512; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>The queue needs the clinic Wi-Fi or mobile data. Check the connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
